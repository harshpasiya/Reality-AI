# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = app/db/migrations

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepends_sys_path = .

# timezone to use when rendering the date within the migration file as
# well as the filename.
# timezone =

# max length of characters to apply to the
# "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to app/db/migrations/versions. When using multiple version
# directories, initial revisions must be created with --version-path.
# The path separator used here should be the separator requiring the
# version files to be created in.
# version_locations = %(here)s/bar:%(here)s/bat:app/db/migrations/versions

# version path separator; As mentioned above, this is the character used to
# split version_locations. The default within ini files is "os", which uses os.pathsep.
# version_path_separator = :

# set to 'true' to search source files recursively; This is relevant only
# for source directory paths with multiple version locations.
# recursive_version_locations = false

# the output encoding used when revision files are written from
# script.py.mda
# output_encoding = utf-8

sqlalchemy.url=

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
