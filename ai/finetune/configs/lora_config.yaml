# ==========================================================================
# LoRA Configuration — Local Debug (Phi-3-mini on RTX 3050, 4 GB VRAM)
# ==========================================================================
#
# This config is used ONLY for local pipeline validation on a 4 GB GPU.
# It pairs with the debug model:  microsoft/Phi-3-mini-4k-instruct (3.8B)
# loaded in 4-bit quantisation (~2.5 GB), leaving ~1.5 GB for LoRA weights,
# activations, and optimiser states.
#
# DO NOT use this config for the production fine-tune — see
# lora_config_full.yaml for the Kaggle/T4 run with Mistral-7B.
# ==========================================================================

# ── r (rank) ──────────────────────────────────────────────────────────────
# The rank of the low-rank decomposition.  A smaller r means fewer trainable
# parameters and less VRAM consumed by the adapter, at the cost of reduced
# representational capacity.  On 4 GB VRAM with a 3.8B model already loaded
# in 4-bit, we need to keep this very lean.  r=8 adds only ~0.5% trainable
# params — enough to steer the model's tone and domain vocabulary for the
# debug run, without exhausting memory.
r: 8

# ── lora_alpha ────────────────────────────────────────────────────────────
# Scaling factor applied to the LoRA update: effective weight delta is
# scaled by (lora_alpha / r).  The convention of setting alpha = 2 * r
# (here 16 / 8 = 2.0 effective multiplier) is widely used because it
# provides a stable learning rate regime across different rank choices —
# when you change r, the update magnitude stays comparable as long as
# alpha tracks proportionally.
lora_alpha: 16

# ── lora_dropout ──────────────────────────────────────────────────────────
# Dropout applied to the LoRA layers during training.  With only ~100
# examples in the debug dataset, overfitting is a real risk — the model
# can memorise the training set in a handful of steps.  0.10 (10%)
# provides meaningful regularisation without being so aggressive that
# the adapter can't learn.
lora_dropout: 0.10

# ── target_modules ────────────────────────────────────────────────────────
# Which linear layers inside the transformer to attach LoRA adapters to.
# This is ARCHITECTURE-SPECIFIC — you must match the actual module names
# in the model's code.
#
# Phi-3-mini uses FUSED attention projections:
#   - qkv_proj : a single linear that produces Q, K, and V in one pass
#   - o_proj   : the output projection after attention
#
# This differs from Mistral/Llama which have separate q_proj, k_proj,
# v_proj layers.  Using the wrong names will silently produce a LoRA
# with zero trainable parameters.
#
# We target only the attention projections (not the MLP gate/up/down)
# to stay within the 4 GB budget.  Attention layers alone capture most
# of the conversational style adaptation we need.
target_modules:
  - qkv_proj
  - o_proj

# ── task_type ─────────────────────────────────────────────────────────────
# CAUSAL_LM tells PEFT to wrap the model for autoregressive (left-to-right)
# language modelling, which is what chat fine-tuning requires.
task_type: CAUSAL_LM

# ── Additional training hints (consumed by the training script) ───────────
# These are NOT LoraConfig fields — the training script reads them
# separately to configure the Trainer.
training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4   # effective batch = 4
  num_train_epochs: 3
  learning_rate: 2.0e-4
  warmup_ratio: 0.05
  fp16: true                       # RTX 3050 supports FP16 but not BF16
  bf16: false
  max_seq_length: 1024             # Phi-3-mini supports 4k, but 1k saves VRAM
  logging_steps: 10
  save_strategy: "epoch"
