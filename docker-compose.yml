# Reality AI — Local development database
# Custom image: postgis/postgis:16-3.4 + pgvector (via db/Dockerfile)
#
# Uses port 5433 on the host to avoid conflicts with a locally installed
# PostgreSQL that may already be occupying port 5432.
#
# Usage:
#   docker-compose up -d --build   # first time (builds the image)
#   docker-compose up -d           # subsequent starts
#   docker-compose down            # stop (data persisted in named volume)
#   docker-compose down -v         # stop AND delete data volume (full reset)

services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: reality_ai_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reality_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reality_ai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-reality_ai}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reality_ai} -d ${POSTGRES_DB:-reality_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pg_data:
    name: reality_ai_pg_data
